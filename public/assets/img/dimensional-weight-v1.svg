<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">How dimensional weight is calculated</title>
  <desc id="desc">A parcel marked 40 by 30 by 20 centimetres is divided by an illustrative divisor of 5000 to give 4.8 kilograms dimensional weight, compared with 3 kilograms measured mass.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b38"/><stop offset="1" stop-color="#223158"/></linearGradient><linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9c76c"/><stop offset="1" stop-color="#e57e59"/></linearGradient><linearGradient id="cyan"><stop stop-color="#37ddc1"/><stop offset="1" stop-color="#65aaff"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#bdc8e9" stroke-opacity=".06"/></pattern><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#83f2dc" stroke-width="2"/></marker></defs>
  <rect width="1400" height="760" rx="40" fill="url(#bg)"/><rect width="1400" height="760" rx="40" fill="url(#grid)"/>
  <g stroke-linejoin="round" stroke-width="5"><path d="m135 282 232-118 223 116-230 129z" fill="#f4ba62" stroke="#ffe1a6"/><path d="m135 282 225 127v202L135 485z" fill="url(#box)" stroke="#ffdda0"/><path d="m360 409 230-129v203L360 611z" fill="#c86e57" stroke="#f8b98c"/><path d="m360 409 230-129" stroke="#fff1d1" opacity=".7"/></g>
  <g fill="none" stroke="#83f2dc" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"><path d="M155 225 365 120"/><path d="M615 263 615 455"/><path d="M385 635 585 522"/></g>
  <g fill="#e9fff9" font-family="Arial,sans-serif" font-size="28" font-weight="700"><text x="208" y="154">40 cm</text><text x="635" y="372">30 cm</text><text x="450" y="642">20 cm</text></g>
  <rect x="700" y="126" width="610" height="472" rx="30" fill="#18274a" stroke="#6077ae" stroke-opacity=".6" stroke-width="2"/>
  <g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><text x="1005" y="226" fill="#c7d3ef" font-size="30">40 × 30 × 20 ÷ 5000</text><text x="1005" y="316" fill="#f6fbff" font-size="49">= 4.8 kg</text><path d="M770 363H1240" stroke="#6e83b8" stroke-opacity=".55" stroke-width="2"/><text x="1005" y="438" fill="#b9c9e9" font-size="26">measured mass</text><text x="1005" y="505" fill="#5de7cf" font-size="42">3.0 kg</text><text x="1005" y="565" fill="#ffd17a" font-size="23">compare the two values</text></g>
  <circle cx="105" cy="652" r="4" fill="#69e8d3"/><circle cx="1290" cy="665" r="5" fill="#ffd17a"/>
</svg>
