<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Regular fourteen-sided polygon</title>
  <desc id="desc">Original geometry illustration of a regular tetradecagon, with fourteen marked vertices, fourteen equal sides, and radial construction lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b38"/><stop offset="1" stop-color="#202e55"/></linearGradient>
    <linearGradient id="face" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#33dbc3" stop-opacity=".36"/><stop offset="1" stop-color="#4376db" stop-opacity=".18"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ef8d6"/><stop offset="1" stop-color="#56a8ff"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#9db5ef" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="700" rx="38" fill="url(#bg)"/><rect width="1200" height="700" rx="38" fill="url(#grid)"/>
  <circle cx="600" cy="350" r="258" fill="none" stroke="#d9e8ff" stroke-opacity=".18" stroke-dasharray="4 11"/>
  <polygon points="600,135 693.3,156.3 768.1,215.9 809.6,302.2 809.6,397.8 768.1,484.1 693.3,543.7 600,565 506.7,543.7 431.9,484.1 390.4,397.8 390.4,302.2 431.9,215.9 506.7,156.3" fill="url(#face)" stroke="url(#edge)" stroke-width="7" stroke-linejoin="round" filter="url(#glow)"/>
  <g stroke="#9bd4ff" stroke-opacity=".4" stroke-width="2"><path d="M600 350 600 135M600 350 768.1 215.9M600 350 809.6 397.8M600 350 693.3 543.7M600 350 431.9 484.1M600 350 390.4 302.2M600 350 506.7 156.3"/></g>
  <g fill="#ecfff9" stroke="#1a2a50" stroke-width="4">
    <circle cx="600" cy="135" r="8"/><circle cx="693.3" cy="156.3" r="8"/><circle cx="768.1" cy="215.9" r="8"/><circle cx="809.6" cy="302.2" r="8"/><circle cx="809.6" cy="397.8" r="8"/><circle cx="768.1" cy="484.1" r="8"/><circle cx="693.3" cy="543.7" r="8"/><circle cx="600" cy="565" r="8"/><circle cx="506.7" cy="543.7" r="8"/><circle cx="431.9" cy="484.1" r="8"/><circle cx="390.4" cy="397.8" r="8"/><circle cx="390.4" cy="302.2" r="8"/><circle cx="431.9" cy="215.9" r="8"/><circle cx="506.7" cy="156.3" r="8"/>
  </g>
  <circle cx="600" cy="350" r="7" fill="#ffd778"/>
  <path d="M602 136q35 3 58 22" fill="none" stroke="#ffd778" stroke-width="8" stroke-linecap="round"/>
  <circle cx="150" cy="132" r="4" fill="#75eed6"/><circle cx="1036" cy="208" r="5" fill="#ffd778"/><circle cx="1013" cy="573" r="3" fill="#fff" opacity=".75"/>
</svg>
