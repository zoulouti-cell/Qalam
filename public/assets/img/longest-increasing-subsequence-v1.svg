<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Longest increasing subsequence example</title>
  <desc id="desc">The sequence 3, 1, 8, 2, 5, 6, 4, 9 is shown above. The longest strictly increasing subsequence 1, 2, 5, 6, 9 is highlighted below and connected to its original positions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c38"/><stop offset="1" stop-color="#25294f"/></linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30dec3"/><stop offset="1" stop-color="#55a7f7"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b6c3f6" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1400" height="760" rx="40" fill="url(#bg)"/><rect width="1400" height="760" rx="40" fill="url(#grid)"/>
  <rect x="78" y="92" width="1244" height="260" rx="28" fill="#19264a" stroke="#7788bb" stroke-opacity=".42" stroke-width="2"/>
  <rect x="78" y="432" width="1244" height="236" rx="28" fill="#172d49" stroke="#43d9bf" stroke-opacity=".46" stroke-width="2"/>
  <g stroke="#95a8d8" stroke-opacity=".3" stroke-width="3" stroke-dasharray="7 9">
    <path d="M180 238V518M326 238V518M472 238V518M618 238V518M764 238V518M910 238V518M1056 238V518M1202 238V518"/>
  </g>
  <g stroke="url(#active)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M326 518 618 518 764 518 910 518 1202 518"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <g fill="#d7def1"><circle cx="180" cy="238" r="45" fill="#344263"/><text x="180" y="238">3</text><circle cx="472" cy="238" r="45" fill="#344263"/><text x="472" y="238">8</text><circle cx="1056" cy="238" r="45" fill="#344263"/><text x="1056" y="238">4</text></g>
    <g fill="#f5fffb" filter="url(#glow)"><circle cx="326" cy="238" r="45" fill="url(#active)"/><text x="326" y="238">1</text><circle cx="618" cy="238" r="45" fill="url(#active)"/><text x="618" y="238">2</text><circle cx="764" cy="238" r="45" fill="url(#active)"/><text x="764" y="238">5</text><circle cx="910" cy="238" r="45" fill="url(#active)"/><text x="910" y="238">6</text><circle cx="1202" cy="238" r="45" fill="url(#active)"/><text x="1202" y="238">9</text></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#f5fffb">
    <circle cx="326" cy="518" r="40" fill="url(#active)"/><text x="326" y="518">1</text><circle cx="618" cy="518" r="40" fill="url(#active)"/><text x="618" y="518">2</text><circle cx="764" cy="518" r="40" fill="url(#active)"/><text x="764" y="518">5</text><circle cx="910" cy="518" r="40" fill="url(#active)"/><text x="910" y="518">6</text><circle cx="1202" cy="518" r="40" fill="url(#active)"/><text x="1202" y="518">9</text>
  </g>
  <g fill="#91a6dc"><circle cx="180" cy="598" r="5"/><circle cx="472" cy="598" r="5"/><circle cx="1056" cy="598" r="5"/></g>
</svg>
