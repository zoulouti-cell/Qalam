<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Powers of ten scale</title>
  <desc id="desc">A visual scale shows ten to the zero equals one, ten to the first equals ten, ten squared equals one hundred, ten cubed equals one thousand, and ten to the sixth equals one million.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a36"/><stop offset="1" stop-color="#253052"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39dbc0"/><stop offset="1" stop-color="#70a9ff"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b7c5ee" stroke-opacity=".06"/></pattern></defs>
  <rect width="1400" height="700" rx="40" fill="url(#bg)"/><rect width="1400" height="700" rx="40" fill="url(#grid)"/>
  <path d="M145 530H1255" stroke="#6e82b4" stroke-width="5" stroke-linecap="round"/><path d="M155 530H1240" stroke="url(#bar)" stroke-width="7" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700">
   <g fill="#eaf5ff"><circle cx="190" cy="530" r="15" fill="#60e9d0"/><text x="190" y="190" font-size="38">10⁰</text><text x="190" y="250" font-size="30">= 1</text><circle cx="440" cy="530" r="20" fill="#57d9ce"/><text x="440" y="190" font-size="38">10¹</text><text x="440" y="250" font-size="30">= 10</text><circle cx="690" cy="530" r="27" fill="#55c1df"/><text x="690" y="190" font-size="38">10²</text><text x="690" y="250" font-size="30">= 100</text><circle cx="940" cy="530" r="36" fill="#61b8f4"/><text x="940" y="190" font-size="38">10³</text><text x="940" y="250" font-size="30">= 1,000</text><circle cx="1190" cy="530" r="48" fill="#87a8ff"/><text x="1190" y="190" font-size="38">10⁶</text><text x="1190" y="250" font-size="30">= 1,000,000</text></g>
  </g>
  <g fill="none" stroke="#8adfd8" stroke-opacity=".35" stroke-width="2"><path d="M190 310V485M440 310V475M690 310V465M940 310V452M1190 310V435"/></g>
  <g fill="#ffe08c" opacity=".8"><circle cx="190" cy="110" r="4"/><circle cx="335" cy="126" r="3"/><circle cx="1040" cy="105" r="5"/><circle cx="1255" cy="388" r="4"/></g>
</svg>
