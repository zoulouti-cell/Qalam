<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Shredding, a traditional tree-pruning method</title>
  <desc id="desc">Three stages show a tall tree, selective removal of side branches while retaining the trunk and upper crown, and regrowth of young shoots.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d7f2f3"/><stop offset="1" stop-color="#f4f2df"/></linearGradient>
    <linearGradient id="trunk" x2="1"><stop stop-color="#70452e"/><stop offset=".5" stop-color="#a56b43"/><stop offset="1" stop-color="#603a2c"/></linearGradient>
    <linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#53aa71"/><stop offset="1" stop-color="#1d684d"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#d39a48"/></marker>
  </defs>
  <rect width="1400" height="700" rx="38" fill="#f8f8ee"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(30 35)">
      <rect width="420" height="630" rx="30" fill="url(#sky)"/>
      <path d="M30 548Q200 514 390 548V600H30Z" fill="#93bd75"/>
      <ellipse cx="215" cy="570" rx="104" ry="18" fill="#263c31" opacity=".16" filter="url(#shadow)"/>
      <path d="M195 552Q210 368 207 202Q207 150 222 88Q238 176 232 240Q227 399 245 552Z" fill="url(#trunk)"/>
      <g fill="none" stroke="#70452e" stroke-width="17" stroke-linecap="round"><path d="M220 330Q165 270 100 254"/><path d="M222 375Q278 315 349 295"/><path d="M217 258Q169 210 135 185"/><path d="M226 285Q278 218 316 197"/><path d="M215 215Q189 165 168 145"/></g>
      <g fill="url(#leaf)"><ellipse cx="101" cy="242" rx="61" ry="34"/><ellipse cx="355" cy="285" rx="59" ry="36"/><ellipse cx="132" cy="174" rx="55" ry="32"/><ellipse cx="326" cy="186" rx="58" ry="34"/><ellipse cx="166" cy="135" rx="52" ry="33"/><ellipse cx="218" cy="91" rx="45" ry="42"/></g>
      <text x="210" y="610" fill="#21495a" font-size="27" font-weight="700">1 · Tall tree</text>
    </g>
    <g transform="translate(490 35)">
      <rect width="420" height="630" rx="30" fill="url(#sky)"/>
      <path d="M30 548Q200 514 390 548V600H30Z" fill="#93bd75"/>
      <ellipse cx="215" cy="570" rx="104" ry="18" fill="#263c31" opacity=".16" filter="url(#shadow)"/>
      <path d="M195 552Q210 368 207 202Q207 150 222 88Q238 176 232 240Q227 399 245 552Z" fill="url(#trunk)"/>
      <g fill="none" stroke="#70452e" stroke-width="17" stroke-linecap="round"><path d="M220 205Q189 160 169 143"/><path d="M222 155Q205 121 194 110"/></g>
      <g fill="url(#leaf)"><ellipse cx="164" cy="138" rx="52" ry="30"/><ellipse cx="190" cy="105" rx="40" ry="28"/><ellipse cx="218" cy="86" rx="43" ry="39"/><ellipse cx="245" cy="111" rx="39" ry="28"/></g>
      <g stroke="#d69046" stroke-width="5" stroke-dasharray="8 8" opacity=".9"><path d="M164 267 90 242"/><path d="M258 290 336 265"/><path d="M163 338 92 358"/><path d="M254 385 336 397"/></g>
      <g fill="#d69046"><path d="m81 230 20 10-17 13Z"/><path d="m345 253-19 12 17 12Z"/><path d="m83 347 18 12-17 11Z"/><path d="m347 386-19 11 19 11Z"/></g>
      <text x="210" y="610" fill="#21495a" font-size="27" font-weight="700">2 · Side branches cut</text>
    </g>
    <g transform="translate(950 35)">
      <rect width="420" height="630" rx="30" fill="url(#sky)"/>
      <path d="M30 548Q200 514 390 548V600H30Z" fill="#93bd75"/>
      <ellipse cx="215" cy="570" rx="104" ry="18" fill="#263c31" opacity=".16" filter="url(#shadow)"/>
      <path d="M195 552Q210 368 207 202Q207 150 222 88Q238 176 232 240Q227 399 245 552Z" fill="url(#trunk)"/>
      <g fill="none" stroke="#70452e" stroke-width="13" stroke-linecap="round"><path d="M217 310Q175 280 146 250"/><path d="M225 357Q260 328 288 299"/><path d="M214 417Q183 394 160 373"/><path d="M233 449Q263 426 283 405"/><path d="M219 265Q200 237 188 212"/></g>
      <g fill="url(#leaf)"><ellipse cx="144" cy="247" rx="38" ry="25"/><ellipse cx="290" cy="296" rx="38" ry="25"/><ellipse cx="158" cy="370" rx="38" ry="25"/><ellipse cx="288" cy="403" rx="38" ry="25"/><ellipse cx="186" cy="208" rx="34" ry="23"/><ellipse cx="218" cy="90" rx="45" ry="42"/></g>
      <path d="M222 170Q295 130 321 105" fill="none" stroke="#d69046" stroke-width="4" marker-end="url(#arrow)"/>
      <text x="210" y="610" fill="#21495a" font-size="27" font-weight="700">3 · New shoots grow</text>
    </g>
  </g>
</svg>
