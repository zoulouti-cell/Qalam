<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">وقل رب زدني علماً</title>
  <desc id="desc">لوحة تعليمية هادئة تعرض آية قرآنية بخط عربي واضح وزخرفة هندسية مغربية.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f0d7"/><stop offset="1" stop-color="#e9dfbf"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b574b"/><stop offset="1" stop-color="#073a34"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b98535"/><stop offset=".5" stop-color="#e3bd6e"/><stop offset="1" stop-color="#b98535"/></linearGradient>
    <pattern id="geometry" width="70" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M35 0 70 35 35 70 0 35Z M35 13 57 35 35 57 13 35Z" fill="none" stroke="#c9a45b" stroke-opacity=".18" stroke-width="2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4b3819" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="760" rx="40" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="40" fill="url(#geometry)"/>
  <rect x="28" y="28" width="1144" height="704" rx="32" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <rect x="48" y="48" width="1104" height="664" rx="24" fill="none" stroke="#0b574b" stroke-opacity=".24" stroke-width="2"/>
  <g filter="url(#shadow)"><path d="M600 150 686 236 600 322 514 236Z" fill="url(#green)" stroke="url(#gold)" stroke-width="5"/><path d="M600 177 659 236 600 295 541 236Z" fill="none" stroke="#f5e5bb" stroke-opacity=".7" stroke-width="2"/><circle cx="600" cy="236" r="12" fill="#e1b75d"/></g>
  <text x="600" y="395" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Tajawal, 'Noto Naskh Arabic', 'Traditional Arabic', serif" font-size="52" font-weight="700" fill="#143e38">وَقُلْ رَبِّ زِدْنِي عِلْمًا</text>
  <path d="M385 430 Q600 462 815 430" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <text x="600" y="492" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Tajawal, 'Noto Naskh Arabic', 'Traditional Arabic', serif" font-size="28" fill="#725a31">سورة طه · الآية ١١٤</text>
  <text x="600" y="590" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Tajawal, 'Noto Naskh Arabic', 'Traditional Arabic', serif" font-size="25" fill="#355b53">آية كريمة تذكّر بفضل العلم وطلب المعرفة</text>
  <g fill="none" stroke="url(#gold)" stroke-width="3"><circle cx="112" cy="112" r="18"/><circle cx="1088" cy="112" r="18"/><circle cx="112" cy="648" r="18"/><circle cx="1088" cy="648" r="18"/></g>
</svg>
