crons:
  - name: daily-reminders
    description: "Morning email/WhatsApp digest of today's and tomorrow's hearings and near deadlines (7:00 Morocco)"
    cron: "0 7 * * *"
    timezone: "Africa/Casablanca"
    endpoint: "{{BASE_URL}}/api/cron/daily-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: drive-sync
    description: "Two-way Google Drive sync + live Sheets refresh for every office that connected Drive"
    cron: "*/10 * * * *"
    timezone: "Africa/Casablanca"
    endpoint: "{{BASE_URL}}/api/cron/drive-sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
