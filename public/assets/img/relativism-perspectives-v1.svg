  <path d="M236 594q128-44 220-35M964 594q-128-44-220-35" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 16"/>
  <circle cx="600" cy="92" r="5" fill="#fff" opacity=".78"/><circle cx="292" cy="106" r="3" fill="#7be7d5"/><circle cx="902" cy="115" r="4" fill="#ffc16b"/>
</svg>
