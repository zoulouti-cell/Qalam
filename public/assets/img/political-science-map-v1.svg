<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">A map of major political science fields</title>
  <desc id="desc">Political science studies power and collective decisions through political theory, comparative politics, institutions, public policy, political behavior, and international relations.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091b35"/><stop offset="1" stop-color="#19435f"/></linearGradient>
    <linearGradient id="center" x2="0" y2="1"><stop stop-color="#23677d"/><stop offset="1" stop-color="#10354f"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#74ded1"/></marker>
  </defs>
  <rect width="1400" height="760" rx="40" fill="url(#bg)"/>
  <text x="700" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#eaf4fc" opacity=".86">POLITICAL SCIENCE · POWER, INSTITUTIONS, AND COLLECTIVE CHOICE</text>
  <g fill="none" stroke="#5bbfb9" stroke-width="5" opacity=".78">
    <path d="M700 360 324 216M700 360 1076 216M700 360 285 475M700 360 1115 475M700 360 465 620M700 360 935 620"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="700" cy="360" r="125" fill="url(#center)" stroke="#ffc66d" stroke-width="5"/>
    <path d="M636 344h128m-112-24 48-46 48 46m-96 35v46m48-46v46m48-46v46M622 401h156" fill="none" stroke="#ffe0a0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="700" y="458" fill="#edf6fb" font-size="24" font-weight="700">Political science</text>
    <g><rect x="175" y="142" width="300" height="132" rx="24" fill="#10334f" stroke="#6bdace" stroke-width="3"/><text x="325" y="198" fill="#edf6fb" font-size="22" font-weight="700">Political theory</text><text x="325" y="235" fill="#b6d0dd" font-size="17">justice · power · legitimacy</text></g>
    <g><rect x="925" y="142" width="300" height="132" rx="24" fill="#10334f" stroke="#ffc66d" stroke-width="3"/><text x="1075" y="198" fill="#edf6fb" font-size="22" font-weight="700">Comparative politics</text><text x="1075" y="235" fill="#b6d0dd" font-size="17">systems · cases · institutions</text></g>
    <g><rect x="130" y="408" width="310" height="132" rx="24" fill="#10334f" stroke="#9c9cea" stroke-width="3"/><text x="285" y="464" fill="#edf6fb" font-size="22" font-weight="700">Political behavior</text><text x="285" y="501" fill="#b6d0dd" font-size="17">voting · participation · opinion</text></g>
    <g><rect x="960" y="408" width="310" height="132" rx="24" fill="#10334f" stroke="#ed8995" stroke-width="3"/><text x="1115" y="464" fill="#edf6fb" font-size="22" font-weight="700">International relations</text><text x="1115" y="501" fill="#b6d0dd" font-size="17">states · conflict · cooperation</text></g>
    <g><rect x="315" y="554" width="300" height="132" rx="24" fill="#10334f" stroke="#83c8ed" stroke-width="3"/><text x="465" y="610" fill="#edf6fb" font-size="22" font-weight="700">Public policy</text><text x="465" y="647" fill="#b6d0dd" font-size="17">design · delivery · evaluation</text></g>
    <g><rect x="785" y="554" width="300" height="132" rx="24" fill="#10334f" stroke="#86d19d" stroke-width="3"/><text x="935" y="610" fill="#edf6fb" font-size="22" font-weight="700">Institutions &amp; law</text><text x="935" y="647" fill="#b6d0dd" font-size="17">rules · authority · accountability</text></g>
  </g>
</svg>
